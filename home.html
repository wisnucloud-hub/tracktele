<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0a192f 0%, #112240 100%);
            height: 100vh; display: flex; justify-content: center; align-items: center;
            font-family: 'Poppins', sans-serif; color: #ccd6f6; overflow: hidden;
        }

        /* ====== LOADING SCREEN ====== */
        #loading {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a192f; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 0.5s ease;
        }
        #loading p { color: #64ffda; font-size: 16px; margin-top: 20px; letter-spacing: 2px; font-weight: 600; }
        .loader {
            border: 4px solid rgba(100, 255, 218, 0.2); border-top: 4px solid #64ffda;
            border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* BACKGROUND BINTANG */
        .particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png');
            animation: moveStars 60s linear infinite; opacity: 0.3; z-index: 0;
        }
        @keyframes moveStars { from {background-position: 0 0;} to {background-position: -10000px 5000px;} }

        /* CARD UTAMA - LANGSUNG MUNCUL */
        .card {
            background: rgba(17, 34, 64, 0.6);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(100, 255, 218, 0.3);
            padding: 40px 30px; border-radius: 20px; text-align: center;
            width: 90%; max-width: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 2;
            opacity: 0; /* disembunyiin dulu, muncul setelah loading */
            transition: opacity 0.5s ease;
        }

        /* GAMBAR MELAYANG */
        .gambar {
            width: 200px; height: 200px; border-radius: 50%; object-fit: cover;
            border: 3px solid #64ffda; margin-bottom: 25px;
            animation: float 3s ease-in-out infinite, glow 3s ease-in-out infinite;
        }
        @keyframes float { 0% {transform: translateY(0px);} 50% {transform: translateY(-15px);} 100% {transform: translateY(0px);} }
        @keyframes glow { 0%, 100% {box-shadow: 0 0 20px rgba(100, 255, 218, 0.3);} 50% {box-shadow: 0 0 40px rgba(100, 255, 218, 0.6);} }

        .judul { font-size: 20px; font-weight: 600; color: #e6f1ff; margin-bottom: 10px; }
        .cta-text { font-size: 14px; color: #8892b0; margin-bottom: 15px; }
        .btn-wa {
            color: white; border: none; padding: 12px 28px; border-radius: 50px;
            font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 20px;
            background: linear-gradient(90deg, #25D366, #128C7E);
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); transition: 0.3s;
        }
        .btn-wa:hover { transform: translateY(-2px); }
        .subjudul { font-size: 12px; color: #8892b0; }

        /* MUSIC PLAYER BUBBLE */
        .music-player {
            position: fixed; bottom: 20px; right: 20px; width: 240px;
            background: rgba(17, 34, 64, 0.9); backdrop-filter: blur(15px);
            border: 1px solid rgba(100, 255, 218, 0.3); border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); z-index: 999; resize: both; overflow: hidden;
        }
        .player-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; background: rgba(100, 255, 218, 0.1);
            border-radius: 12px 12px 0 0; cursor: grab; user-select: none;
        }
        .song-title { font-size: 12px; font-weight: 600; color: #64ffda; }
        .btn-close { background: none; border: none; color: #ccd6f6; font-size: 18px; cursor: pointer; }
        .player-body { display: flex; align-items: center; padding: 10px; gap: 8px; }
        .btn-play {
            background: #64ffda; color: #0a192f; border: none; border-radius: 50%;
            width: 32px; height: 32px; font-size: 14px; cursor: pointer; flex-shrink: 0;
        }
        #progressBar { width: 100%; height: 4px; accent-color: #64ffda; }
        .time { font-size: 10px; color: #8892b0; display: flex; justify-content: space-between; margin-top: 4px; }
    </style>
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loading">
        <div class="loader"></div>
        <p>Mohon tunggu sebentar...</p>
    </div>

    <div class="particles"></div>

    <div class="card" id="mainCard">
        <img src="https://raw.githubusercontent.com/wisnucloud-hub/tracktele/main/85c120b53bf7193db54843e0e4e4adf8.jpg" alt="Gambar" class="gambar">
        <h1 class="judul">Data IP dan foto lu udah di tangan yang ngirim link ini 😈</h1>
        <p class="cta-text">mau kaya gini juga? chat wa pake button di bawah</p>
        <button class="btn-wa" onclick="bukaWA()">Chat WA</button>
        <p class="subjudul">Create by wisnu cloud</p>
    </div>

    <!-- MUSIC PLAYER BUBBLE -->
    <div class="music-player" id="musicPlayer">
        <div class="player-header" id="playerHeader">
            <span class="song-title">teh hijau💃</span>
            <button class="btn-close" onclick="closePlayer()">×</button>
        </div>
        <div class="player-body">
            <button class="btn-play" id="playBtn">▶</button>
            <div class="progress-container">
                <input type="range" id="progressBar" value="0" max="100">
                <div class="time">
                    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                </div>
            </div>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

<script>
// ================== 1. MUSIC PLAYER ==================
const audio = document.getElementById('bg-music');
const playBtn = document.getElementById('playBtn');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const durationEl = document.getElementById('duration');
const player = document.getElementById('musicPlayer');
const header = document.getElementById('playerHeader');

playBtn.addEventListener('click', () => {
    if (audio.paused) {
        audio.play().catch(()=>{});
        playBtn.textContent = '⏸';
    } else {
        audio.pause();
        playBtn.textContent = '▶';
    }
});
audio.addEventListener('timeupdate', () => {
    if(!isNaN(audio.duration)){
        progressBar.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.textContent = formatTime(audio.currentTime);
    }
});
audio.addEventListener('loadedmetadata', () => { durationEl.textContent = formatTime(audio.duration); });
progressBar.addEventListener('input', () => { audio.currentTime = (progressBar.value / 100) * audio.duration; });
function formatTime(s) { if(isNaN(s)) return "0:00"; const m = Math.floor(s/60); const sec = Math.floor(s%60); return `${m}:${sec<10?'0':''}${sec}`; }
function closePlayer() { player.style.display = 'none'; audio.pause(); }

// Drag player
let isDragging = false, offsetX, offsetY;
header.addEventListener('mousedown', e => {isDragging=true; offsetX=e.clientX-player.offsetLeft; offsetY=e.clientY-player.offsetTop;});
document.addEventListener('mousemove', e => {if(isDragging){player.style.left=`${e.clientX-offsetX}px`;player.style.top=`${e.clientY-offsetY}px`;player.style.right='auto';player.style.bottom='auto';}});
document.addEventListener('mouseup', ()=>isDragging=false);

// ================== 2. TOMBOL WA ==================
function bukaWA() {
    window.open('https://wa.me/6285860605722?text=Halo%20kak,%20aku%20mau%20pesan%20web%20prank%20kayak%20gini', '_blank');
}

// <script>
// ================== BAGIAN 3: LOADING 1 DETIK ==================
window.addEventListener("load", function() {
    const loading = document.getElementById("loading");
    const card = document.getElementById("mainCard");

    setTimeout(function() {
        loading.style.opacity = "0";
        setTimeout(() => {
            loading.style.display = "none";
            card.style.opacity = "1";
        }, 500); // fade 0.5 detik
    }, 1000); // INI 1000ms = 1 detik
});
</script>
</body>
    </html></html>
