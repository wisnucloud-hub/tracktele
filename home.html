<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- LOADING SCREEN -->
    <div id="loading">
        <div class="loader"></div>
        <p>Mohon tunggu sebentar...</p>
    </div>

    <!-- BACKGROUND BINTANG -->
    <div class="particles"></div>

    <!-- CARD WRAPPER BUAT PUZZLE -->
    <div class="card-wrapper">
        <div class="card" id="cardToPuzzle">
            <img src="https://raw.githubusercontent.com/wisnucloud-hub/tracktele/main/85c120b53bf7193db54843e0e4e4adf8.jpg" alt="Gambar" class="gambar">
            <h1 class="judul">Data IP dan foto lu udah di tangan yang ngirim link ini 😈</h1>
            <p class="cta-text">mau kaya gini juga? chat wa pake button di bawah</p>
            <button class="btn-wa" onclick="bukaWA()">Chat WA</button>
            <p class="subjudul">Create by Wisnu & Raisya</p>
        </div>
    </div>

    <!-- MUSIC PLAYER BUBBLE -->
    <div class="music-player" id="musicPlayer">
        <div class="player-header" id="playerHeader">
            <span class="song-title">teh hijau💃</span>
            <button class="btn-close" onclick="closePlayer()">×</button>
        </div>
        <div class="player-body">
            <button class="btn-play" id="playBtn">▶</button>
            <div class="progress-container">
                <input type="range" id="progressBar" value="0" max="100">
                <div class="time">
                    <span id="currentTime">0:00</span> / <span id="duration">0:00</span>
                </div>
            </div>
        </div>
    </div>

    <audio id="bg-music" loop>
        <source src="https://d.uguu.se/MDvAiwFK.mp3" type="audio/mpeg">
    </audio>

<script>
// ================== 1. MUSIC PLAYER ==================
const audio = document.getElementById('bg-music');
const playBtn = document.getElementById('playBtn');
const progressBar = document.getElementById('progressBar');
const currentTimeEl = document.getElementById('currentTime');
const durationEl = document.getElementById('duration');
const player = document.getElementById('musicPlayer');
const header = document.getElementById('playerHeader');

playBtn.addEventListener('click', () => {
    if (audio.paused) {
        audio.play().catch(e => console.log("Autoplay diblock browser"));
        playBtn.textContent = '⏸';
    } else {
        audio.pause();
        playBtn.textContent = '▶';
    }
});
audio.addEventListener('timeupdate', () => {
    if(!isNaN(audio.duration)){
        const progress = (audio.currentTime / audio.duration) * 100;
        progressBar.value = progress;
        currentTimeEl.textContent = formatTime(audio.currentTime);
    }
});
audio.addEventListener('loadedmetadata', () => { durationEl.textContent = formatTime(audio.duration); });
progressBar.addEventListener('input', () => { audio.currentTime = (progressBar.value / 100) * audio.duration; });
function formatTime(seconds) {
    if(isNaN(seconds)) return "0:00";
    const min = Math.floor(seconds / 60);
    const sec = Math.floor(seconds % 60);
    return `${min}:${sec < 10 ? '0' : ''}${sec}`;
}
function closePlayer() { player.style.display = 'none'; audio.pause(); }

// Drag player
let isDragging = false; let offsetX, offsetY;
header.addEventListener('mousedown', startDrag);
header.addEventListener('touchstart', startDrag);
document.addEventListener('mousemove', drag);
document.addEventListener('touchmove', drag);
document.addEventListener('mouseup', stopDrag);
document.addEventListener('touchend', stopDrag);
function startDrag(e) {
    isDragging = true;
    const touch = e.touches ? e.touches[0] : e;
    offsetX = touch.clientX - player.offsetLeft;
    offsetY = touch.clientY - player.offsetTop;
}
function drag(e) {
    if (!isDragging) return; e.preventDefault();
    const touch = e.touches ? e.touches[0] : e;
    player.style.left = `${touch.clientX - offsetX}px`;
    player.style.top = `${touch.clientY - offsetY}px`;
    player.style.right = 'auto'; player.style.bottom = 'auto';
}
function stopDrag() { isDragging = false; }

// ================== 2. TOMBOL WA ==================
function bukaWA() {
    window.open('https://wa.me/628123456789?text=Halo%20kak,%20aku%20mau%20pesan%20web%20prank%20kayak%20gini', '_blank');
}

// ================== 3. LOADING 5s + PUZZLE FULL CARD 2s ==================
window.addEventListener("load", function() {
    const loading = document.getElementById("loading");
    const wrapper = document.querySelector(".card-wrapper");
    const card = document.getElementById("cardToPuzzle");
    
    // Screenshot card jadi 1 gambar pake html2canvas logic manual
    // Kita pake background gradient + gambar
    const bgImage = card.querySelector('.gambar').src;
    wrapper.style.setProperty('--bg', `url(${bgImage})`);

    // Sembunyiin isi card dulu
    card.style.opacity = "0";

    // Bikin 9 keping dari seluruh card
    for(let i = 0; i < 9; i++) {
        const piece = document.createElement("div");
        piece.classList.add("puzzle-piece");
        let row = Math.floor(i / 3);
        let col = i % 3;
        piece.style.width = "33.33%";
        piece.style.height = "33.33%";
        piece.style.left = `${col * 33.33}%`;
        piece.style.top = `${row * 33.33}%`;
        
        // Kuncinya: background nya pake screenshot card
        piece.style.background = `rgba(17, 34, 64, 0.6) url(${bgImage})`;
        piece.style.backgroundSize = `300% 300%`;
        piece.style.backgroundPosition = `${col * -100}% ${row * -100}%`;
        piece.style.border = `1px solid rgba(100, 255, 218, 0.3)`;
        piece.style.backdropFilter = `blur(15px)`;
        
        // Acak posisi
        piece.style.transform = `translate(${(Math.random()-0.5)*500}px, ${(Math.random()-0.5)*500}px) rotate(${Math.random()*720}deg)`;
        wrapper.appendChild(piece);
    }

    // Setelah 5 detik loading ilang
    setTimeout(function() {
        loading.style.opacity = "0";
        setTimeout(() => {
            loading.style.display = "none";
            wrapper.classList.add("loaded"); // trigger animasi 2 detik
        }, 500);
        
        // 2 detik kemudian card asli muncul
        setTimeout(() => {
            card.style.opacity = "1";
        }, 2500);
        
    }, 5000);
});
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: linear-gradient(135deg, #0a192f 0%, #112240 100%);
    height: 100vh; display: flex; justify-content: center; align-items: center;
    font-family: 'Poppins', sans-serif; color: #ccd6f6; overflow: hidden;
}

/* ====== LOADING SCREEN ====== */
#loading {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #0a192f; z-index: 9999;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    transition: opacity 0.5s ease;
}
#loading p { color: #64ffda; font-size: 16px; margin-top: 20px; letter-spacing: 2px; font-weight: 600; }
.loader {
    border: 4px solid rgba(100, 255, 218, 0.2); border-top: 4px solid #64ffda;
    border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); }

/* BACKGROUND BINTANG */
.particles {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: url('https://www.transparenttextures.com/patterns/stardust.png');
    animation: moveStars 60s linear infinite; opacity: 0.3;
}
@keyframes moveStars { from {background-position: 0 0;} to {background-position: -10000px 5000px;} }

/* CARD WRAPPER BUAT PUZZLE */
.card-wrapper {
    position: relative; width: 90%; max-width: 400px;
    border-radius: 20px; overflow: hidden; /* penting biar kepingan rapi */
}

/* CARD UTAMA */
.card {
    background: rgba(17, 34, 64, 0.6);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(100, 255, 218, 0.3);
    padding: 40px 30px; border-radius: 20px; text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    transition: opacity 0.5s 1.8s;
}

/* GAMBAR MELAYANG */
.gambar {
    width: 200px; height: 200px; border-radius: 50%; object-fit: cover;
    border: 3px solid #64ffda; margin-bottom: 25px;
    animation: float 3s ease-in-out infinite, glow 3s ease-in-out infinite;
}
@keyframes float { 0% {transform: translateY(0px);} 50% {transform: translateY(-15px);} 100% {transform: translateY(0px);} }
@keyframes glow { 0%, 100% {box-shadow: 0 0 20px rgba(100, 255, 218, 0.3);} 50% {box-shadow: 0 0 40px rgba(100, 255, 218, 0.6);} }

.judul { font-size: 20px; font-weight: 600; color: #e6f1ff; margin-bottom: 10px; }
.cta-text { font-size: 14px; color: #8892b0; margin-bottom: 15px; }
.btn-wa {
    color: white; border: none; padding: 12px 28px; border-radius: 50px;
    font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 20px;
    background: linear-gradient(90deg, #25D366, #128C7E);
    box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); transition: 0.3s;
}
.btn-wa:hover { transform: translateY(-2px); }
.subjudul { font-size: 12px; color: #8892b0; }

/* 9 KEPING PUZZLE FULL CARD */
.puzzle-piece {
    position: absolute;
    transition: all 2s cubic-bezier(0.77, 0, 0.175, 1);
    opacity: 0; z-index: 2;
    border-radius: 10px;
}
.card-wrapper.loaded .puzzle-piece {
    transform: translate(0, 0) !important; 
    opacity: 1;
}

/* MUSIC PLAYER BUBBLE */
.music-player {
    position: fixed; bottom: 20px; right: 20px; width: 240px; min-width: 200px;
    background: rgba(17, 34, 64, 0.9); backdrop-filter: blur(15px);
    border: 1px solid rgba(100, 255, 218, 0.3); border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); z-index: 999; resize: both; overflow: hidden;
}
.player-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; background: rgba(100, 255, 218, 0.1);
    border-radius: 12px 12px 0 0; cursor: grab; touch-action: none; user-select: none;
}
.player-header:active { cursor: grabbing; }
.song-title { font-size: 12px; font-weight: 600; color: #64ffda; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
.btn-close { background: none; border: none; color: #ccd6f6; font-size: 18px; cursor: pointer; }
.player-body { display: flex; align-items: center; padding: 10px; gap: 8px; }
.btn-play {
    background: #64ffda; color: #0a192f; border: none; border-radius: 50%;
    width: 32px; height: 32px; font-size: 14px; cursor: pointer; flex-shrink: 0; transition: 0.2s;
}
#progressBar { width: 100%; height: 4px; accent-color: #64ffda; }
.time { font-size: 10px; color: #8892b0; display: flex; justify-content: space-between; margin-top: 4px; }
</style>

</body>
</html>
